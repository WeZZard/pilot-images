# pilot-images — macos26-games line configuration. Sourced by host/*.zsh (zsh syntax).
#
# A DERIVED line: its work VM is a clone of the promoted macos26 base, not of a
# seed, and its phases add only game-engine software on top. The general base
# does not grow by the engines' tens of GB, and every macos26 guarantee is
# inherited and re-checked (checks/acceptance.zsh runs the parent's acceptance
# first). Every key is written out literally because vm-service reads this file
# as data, not by sourcing it.

LINE_KIND="macos"
GUEST_SHELL="zsh"

PARENT_LINE="macos26"               # the line whose promoted base this line starts from
PARENT_BASE="pilot-macos26-base"    # cloned to WORK_VM on a fresh build; never booted by this line
WORK_VM="pilot-macos26-games-work"
BASE_VM="pilot-macos26-games-base"  # credential-free golden image
CLONE_PREFIX="pilot-mac26g-"

DISK_GB=200                         # inherited from the parent base; a clone cannot shrink it
CPU=6
MEMORY_MB=8192
DISPLAY_W=1920
DISPLAY_H=1080

GUEST_USER="station"
GUEST_PASS="station"

# Inherited parent values that the parent's acceptance (run by this line's
# checks/acceptance.zsh) reads from the environment.
XCODE_VERSION="26.6"
NODE_MAJOR="22"
NVM_VERSION="v0.40.3"
PYTHON_VERSION="3.14.6"
