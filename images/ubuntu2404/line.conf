# pilot-images — Ubuntu 24.04 line configuration. Sourced by host/*.zsh (zsh syntax).
# Adopted 2026-08-12. Doctrine: images/ubuntu2404/DOCTRINE.md.

LINE_KIND="linux"                   # selects the linux provisioning path in build-base.zsh
GUEST_SHELL="bash"                  # guest phase/check interpreter

SEED_OCI="ghcr.io/cirruslabs/ubuntu:24.04"
SEED_LOCAL="pilot-ubuntu2404-seed"  # pristine local copy of SEED_OCI — never boot, never modify
WORK_VM="pilot-ubuntu2404-work"     # provisioning target
BASE_VM="pilot-ubuntu-base"         # existing hand-built base name kept; promote-base refuses to
                                    # overwrite it, so a scripted rebuild renames the old one first
CLONE_PREFIX="pilot-"               # clones: pilot-<purpose> (e.g. pilot-x-reference)

DISK_GB=80
CPU=6
MEMORY_MB=16384
DISPLAY_W=3840                      # Retina contract: 3840x2160 @ 200% => 1920x1080 logical
DISPLAY_H=2160

GUEST_USER="admin"                  # cirrus ubuntu:24.04 seed default (password: admin). The promoted
GUEST_PASS="admin"                  # base is GUI-only (SSH used only during provisioning).
