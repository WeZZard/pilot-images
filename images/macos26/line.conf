# pilot-images — macOS 26 line configuration. Sourced by host/*.zsh (zsh syntax).

LINE_KIND="macos"                   # selects the macOS provisioning path in build-base.zsh
GUEST_SHELL="zsh"                   # guest phase/check interpreter

SEED_OCI="ghcr.io/cirruslabs/macos-tahoe-base:latest"
SEED_LOCAL="pilot-macos26-seed"     # pristine local copy of SEED_OCI — never boot, never modify
WORK_VM="pilot-macos26-work"        # provisioning target; promoted into BASE_VM by promote-base.zsh
BASE_VM="pilot-macos26-base"        # credential-free golden image
CLONE_PREFIX="pilot-mac-"

DISK_GB=200
CPU=6
MEMORY_MB=8192
# Display: 1920x1080 logical @ Retina 2x (3840x2160 px) @ 60 Hz. macOS VMs treat
# --display as points, so 1920x1080 => a HiDPI display; guest/25-display.zsh then
# selects and persists the 1920x1080 HiDPI mode (macOS otherwise boots at a tiny
# default). Refresh is fixed at 60 Hz by Virtualization.framework.
DISPLAY_W=1920
DISPLAY_H=1080

# The Cirrus seed ships an `admin`/`admin` account; the image account is
# `station`/`station`. build-base connects as SEED_USER, creates GUEST_USER as
# the auto-login default, removes SEED_USER, then provisions as GUEST_USER — so
# the account is native (no /Users/admin residue, no path repair).
SEED_USER="admin"                   # cirrus seed default, initial connect only
SEED_PASS="admin"
GUEST_USER="station"                # image account (auto-login). Host-local NAT only.
GUEST_PASS="station"

XCODE_XIP="${XCODE_XIP:-$HOME/Downloads/Xcode_26.6.xip}"
XCODE_VERSION="26.6"
NODE_MAJOR="22"
NVM_VERSION="v0.40.3"
PYTHON_VERSION="3.14.6"
